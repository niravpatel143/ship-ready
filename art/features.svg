<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="100%" stop-color="#0a1120"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.8" fill="#ffffff" opacity="0.02"/>
    </pattern>
    <!-- Card base -->
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1929"/>
      <stop offset="100%" stop-color="#090f1a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>
  <rect width="1200" height="520" fill="url(#dots)"/>

  <!-- Section title -->
  <text x="600" y="50" fill="#f0f6fc" font-size="22" font-weight="700" text-anchor="middle"
        font-family="'Segoe UI', system-ui, sans-serif">
    Everything you need to ship Laravel with confidence
  </text>
  <line x1="400" y1="62" x2="800" y2="62" stroke="#1a2535" stroke-width="1"/>

  <!-- ════════════ ROW 1 ════════════ -->

  <!-- Card: 111 Static Checks -->
  <g transform="translate(30, 80)">
    <rect width="356" height="100" rx="12" fill="url(#card)" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3"/>
    <rect width="356" height="100" rx="12" fill="#22c55e" fill-opacity="0.03"/>
    <!-- Icon circle -->
    <circle cx="44" cy="50" r="28" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3"/>
    <text x="44" y="56" fill="#22c55e" font-size="22" text-anchor="middle" font-family="monospace">🔒</text>
    <!-- Text -->
    <text x="84" y="36" fill="#f0f6fc" font-size="16" font-weight="700"
          font-family="'Segoe UI', system-ui, sans-serif">111 Static Checks</text>
    <text x="84" y="56" fill="#6b7280" font-size="12"
          font-family="'Segoe UI', system-ui, sans-serif">Security · Performance · Reliability</text>
    <text x="84" y="74" fill="#6b7280" font-size="12"
          font-family="'Segoe UI', system-ui, sans-serif">Version · Octane · Queue · Tenancy</text>
    <!-- Badge -->
    <rect x="290" y="12" width="56" height="20" rx="10" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4"/>
    <text x="318" y="26" fill="#4ade80" font-size="10" text-anchor="middle" font-weight="600"
          font-family="'Segoe UI', system-ui, sans-serif">9 CATEG.</text>
  </g>

  <!-- Card: MCP Server -->
  <g transform="translate(422, 80)">
    <rect width="356" height="100" rx="12" fill="url(#card)" stroke="#f97316" stroke-width="1" stroke-opacity="0.3"/>
    <rect width="356" height="100" rx="12" fill="#f97316" fill-opacity="0.03"/>
    <circle cx="44" cy="50" r="28" fill="#f97316" fill-opacity="0.08" stroke="#f97316" stroke-width="1" stroke-opacity="0.3"/>
    <text x="44" y="56" fill="#fb923c" font-size="22" text-anchor="middle" font-family="monospace">🤖</text>
    <text x="84" y="36" fill="#f0f6fc" font-size="16" font-weight="700"
          font-family="'Segoe UI', system-ui, sans-serif">MCP Server</text>
    <text x="84" y="56" fill="#6b7280" font-size="12"
          font-family="'Segoe UI', system-ui, sans-serif">AI agent integration via JSON-RPC 2.0</text>
    <text x="84" y="74" fill="#6b7280" font-size="12"
          font-family="'Segoe UI', system-ui, sans-serif">Claude Code · Cursor · GitHub Copilot</text>
    <rect x="282" y="12" width="64" height="20" rx="10" fill="#f97316" fill-opacity="0.12" stroke="#f97316" stroke-width="1" stroke-opacity="0.4"/>
    <text x="314" y="26" fill="#fb923c" font-size="10" text-anchor="middle" font-weight="600"
          font-family="'Segoe UI', system-ui, sans-serif">ship:mcp</text>
  </g>

  <!-- Card: 7 Output Formats -->
  <g transform="translate(814, 80)">
    <rect width="356" height="100" rx="12" fill="url(#card)" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>
    <rect width="356" height="100" rx="12" fill="#3b82f6" fill-opacity="0.03"/>
    <circle cx="44" cy="50" r="28" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>
    <text x="44" y="56" fill="#60a5fa" font-size="22" text-anchor="middle" font-family="monospace">📊</text>
    <text x="84" y="36" fill="#f0f6fc" font-size="16" font-weight="700"
          font-family="'Segoe UI', system-ui, sans-serif">7 Output Formats</text>
    <text x="84" y="56" fill="#6b7280" font-size="12"
          font-family="'Segoe UI', system-ui, sans-serif">Console · JSON · SARIF · JUnit</text>
    <text x="84" y="74" fill="#6b7280" font-size="12"
          font-family="'Segoe UI', system-ui, sans-serif">Markdown · HTML · GitHub Annotations</text>
    <rect x="268" y="12" width="78" height="20" rx="10" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
    <text x="307" y="26" fill="#60a5fa" font-size="10" text-anchor="middle" font-weight="600"
          font-family="'Segoe UI', system-ui, sans-serif">GH SCANNING</text>
  </g>

  <!-- ════════════ ROW 2 ════════════ -->

  <!-- Card: Live HTTP Probe -->
  <g transform="translate(30, 200)">
    <rect width="356" height="100" rx="12" fill="url(#card)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3"/>
    <rect width="356" height="100" rx="12" fill="#06b6d4" fill-opacity="0.03"/>
    <circle cx="44" cy="50" r="28" fill="#06b6d4" fill-opacity="0.08" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3"/>
    <text x="44" y="56" fill="#22d3ee" font-size="22" text-anchor="middle" font-family="monospace">🌐</text>
    <text x="84" y="36" fill="#f0f6fc" font-size="16" font-weight="700"
          font-family="'Segoe UI', system-ui, sans-serif">Live HTTP Probe</text>
    <text x="84" y="56" fill="#6b7280" font-size="12"
          font-family="'Segoe UI', system-ui, sans-serif">HSTS · CSP · Cookie flags · X-Frame</text>
    <text x="84" y="74" fill="#6b7280" font-size="12"
          font-family="'Segoe UI', system-ui, sans-serif">/.env · /.git · /telescope exposure</text>
    <rect x="280" y="12" width="66" height="20" rx="10" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4"/>
    <text x="313" y="26" fill="#22d3ee" font-size="10" text-anchor="middle" font-weight="600"
          font-family="'Segoe UI', system-ui, sans-serif">ship:probe</text>
  </g>

  <!-- Card: Deploy Gates -->
  <g transform="translate(422, 200)">
    <rect width="356" height="100" rx="12" fill="url(#card)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3"/>
    <rect width="356" height="100" rx="12" fill="#a855f7" fill-opacity="0.03"/>
    <circle cx="44" cy="50" r="28" fill="#a855f7" fill-opacity="0.08" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3"/>
    <text x="44" y="56" fill="#c084fc" font-size="22" text-anchor="middle" font-family="monospace">🚀</text>
    <text x="84" y="36" fill="#f0f6fc" font-size="16" font-weight="700"
          font-family="'Segoe UI', system-ui, sans-serif">Deploy Gates</text>
    <text x="84" y="56" fill="#6b7280" font-size="12"
          font-family="'Segoe UI', system-ui, sans-serif">Laravel Forge · Laravel Cloud</text>
    <text x="84" y="74" fill="#6b7280" font-size="12"
          font-family="'Segoe UI', system-ui, sans-serif">Envoyer · GitHub Actions</text>
    <rect x="270" y="12" width="76" height="20" rx="10" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4"/>
    <text x="308" y="26" fill="#c084fc" font-size="10" text-anchor="middle" font-weight="600"
          font-family="'Segoe UI', system-ui, sans-serif">ship:install</text>
  </g>

  <!-- Card: Octane + Tenancy -->
  <g transform="translate(814, 200)">
    <rect width="356" height="100" rx="12" fill="url(#card)" stroke="#ec4899" stroke-width="1" stroke-opacity="0.3"/>
    <rect width="356" height="100" rx="12" fill="#ec4899" fill-opacity="0.03"/>
    <circle cx="44" cy="50" r="28" fill="#ec4899" fill-opacity="0.08" stroke="#ec4899" stroke-width="1" stroke-opacity="0.3"/>
    <text x="44" y="56" fill="#f472b6" font-size="22" text-anchor="middle" font-family="monospace">⚡</text>
    <text x="84" y="36" fill="#f0f6fc" font-size="16" font-weight="700"
          font-family="'Segoe UI', system-ui, sans-serif">Octane &amp; Tenancy Checks</text>
    <text x="84" y="56" fill="#6b7280" font-size="12"
          font-family="'Segoe UI', system-ui, sans-serif">Singleton leaks · Mutable statics</text>
    <text x="84" y="74" fill="#6b7280" font-size="12"
          font-family="'Segoe UI', system-ui, sans-serif">Tenant scope · Cache isolation</text>
    <rect x="278" y="12" width="68" height="20" rx="10" fill="#ec4899" fill-opacity="0.12" stroke="#ec4899" stroke-width="1" stroke-opacity="0.4"/>
    <text x="312" y="26" fill="#f472b6" font-size="10" text-anchor="middle" font-weight="600"
          font-family="'Segoe UI', system-ui, sans-serif">12 CHECKS</text>
  </g>

  <!-- ════════════ ROW 3 ════════════ -->

  <!-- Card: Env Drift -->
  <g transform="translate(30, 320)">
    <rect width="356" height="100" rx="12" fill="url(#card)" stroke="#eab308" stroke-width="1" stroke-opacity="0.3"/>
    <rect width="356" height="100" rx="12" fill="#eab308" fill-opacity="0.03"/>
    <circle cx="44" cy="50" r="28" fill="#eab308" fill-opacity="0.08" stroke="#eab308" stroke-width="1" stroke-opacity="0.3"/>
    <text x="44" y="56" fill="#fbbf24" font-size="22" text-anchor="middle" font-family="monospace">🔍</text>
    <text x="84" y="36" fill="#f0f6fc" font-size="16" font-weight="700"
          font-family="'Segoe UI', system-ui, sans-serif">Env Drift Detection</text>
    <text x="84" y="56" fill="#6b7280" font-size="12"
          font-family="'Segoe UI', system-ui, sans-serif">Compare .env files safely</text>
    <text x="84" y="74" fill="#6b7280" font-size="12"
          font-family="'Segoe UI', system-ui, sans-serif">No secret values leaked ever</text>
    <rect x="282" y="12" width="64" height="20" rx="10" fill="#eab308" fill-opacity="0.12" stroke="#eab308" stroke-width="1" stroke-opacity="0.4"/>
    <text x="314" y="26" fill="#fbbf24" font-size="10" text-anchor="middle" font-weight="600"
          font-family="'Segoe UI', system-ui, sans-serif">ship:drift</text>
  </g>

  <!-- Card: Livewire/Filament/Payments -->
  <g transform="translate(422, 320)">
    <rect width="356" height="100" rx="12" fill="url(#card)" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3"/>
    <rect width="356" height="100" rx="12" fill="#6366f1" fill-opacity="0.03"/>
    <circle cx="44" cy="50" r="28" fill="#6366f1" fill-opacity="0.08" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3"/>
    <text x="44" y="56" fill="#818cf8" font-size="22" text-anchor="middle" font-family="monospace">📦</text>
    <text x="84" y="36" fill="#f0f6fc" font-size="16" font-weight="700"
          font-family="'Segoe UI', system-ui, sans-serif">Package Checks</text>
    <text x="84" y="56" fill="#6b7280" font-size="12"
          font-family="'Segoe UI', system-ui, sans-serif">Livewire · Filament · Payments</text>
    <text x="84" y="74" fill="#6b7280" font-size="12"
          font-family="'Segoe UI', system-ui, sans-serif">Webhook signatures · Upload rules</text>
    <rect x="280" y="12" width="66" height="20" rx="10" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4"/>
    <text x="313" y="26" fill="#818cf8" font-size="10" text-anchor="middle" font-weight="600"
          font-family="'Segoe UI', system-ui, sans-serif">5 CHECKS</text>
  </g>

  <!-- Card: Baseline + Custom -->
  <g transform="translate(814, 320)">
    <rect width="356" height="100" rx="12" fill="url(#card)" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.3"/>
    <rect width="356" height="100" rx="12" fill="#14b8a6" fill-opacity="0.03"/>
    <circle cx="44" cy="50" r="28" fill="#14b8a6" fill-opacity="0.08" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.3"/>
    <text x="44" y="56" fill="#2dd4bf" font-size="22" text-anchor="middle" font-family="monospace">⚙️</text>
    <text x="84" y="36" fill="#f0f6fc" font-size="16" font-weight="700"
          font-family="'Segoe UI', system-ui, sans-serif">Baseline &amp; Custom Checks</text>
    <text x="84" y="56" fill="#6b7280" font-size="12"
          font-family="'Segoe UI', system-ui, sans-serif">Suppress known · @ship-ignore</text>
    <text x="84" y="74" fill="#6b7280" font-size="12"
          font-family="'Segoe UI', system-ui, sans-serif">make:ship-check · Auto-discovered</text>
    <rect x="268" y="12" width="78" height="20" rx="10" fill="#14b8a6" fill-opacity="0.12" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.4"/>
    <text x="307" y="26" fill="#2dd4bf" font-size="10" text-anchor="middle" font-weight="600"
          font-family="'Segoe UI', system-ui, sans-serif">ZERO CONFIG</text>
  </g>

  <!-- Bottom bar -->
  <line x1="30" y1="454" x2="1170" y2="454" stroke="#0f1929" stroke-width="1"/>
  <text x="600" y="480" fill="#1e2d3f" font-size="13" text-anchor="middle"
        font-family="'Segoe UI', system-ui, sans-serif">
    nivoin/ship-ready  ·  v1.1.0  ·  PHP 8.2+  ·  Laravel 11 | 12 | 13  ·  MIT License
  </text>
</svg>
